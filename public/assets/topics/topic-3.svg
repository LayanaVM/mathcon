<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2C4E47" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#182E28" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glowGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8FBFA8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad3)"/>
  <rect width="400" height="500" fill="url(#glowGrad3)"/>

  <!-- Subtle quantum grid lines -->
  <g stroke="#8FBFA8" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.18">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
  </g>

  <!-- Formula watermark -->
  <text x="370" y="45" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#8FBFA8" opacity="0.4" text-anchor="end">det(A - lambda I) = 0</text>

  <!-- Track badge in top left corner of artwork -->
  <g transform="translate(26, 26)">
    <rect width="48" height="24" rx="4" fill="#142723" stroke="#3ddc84" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#3ddc84" text-anchor="middle">T03</text>
  </g>

  <!-- Track graphic visualization -->
  <g>
    
      <!-- Spectral Decomposition & Eigenvectors -->
      <ellipse cx="200" cy="180" rx="120" ry="55" transform="rotate(-25 200 180)" fill="none" stroke="#8FBFA8" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.4"/>
      <ellipse cx="200" cy="180" rx="85" ry="38" transform="rotate(-25 200 180)" fill="#3ddc84" fill-opacity="0.1" stroke="#3ddc84" stroke-width="2" opacity="0.8"/>
      <!-- Orthogonal Eigenvector Axes -->
      <line x1="100" y1="225" x2="300" y2="135" stroke="#3ddc84" stroke-width="2.5"/>
      <line x1="170" y1="110" x2="230" y2="250" stroke="#8FBFA8" stroke-width="2"/>
      <circle cx="200" cy="180" r="5" fill="#ffffff"/>
      <!-- Spectral density spikes -->
      <path d="M 80 230 L 120 220 L 150 170 L 180 210 L 220 140 L 250 200 L 290 170 L 320 230" fill="none" stroke="#3ddc84" stroke-width="2" opacity="0.75"/>
    
  </g>
</svg>