<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bgGrad8" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2C4E47" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#132520" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glowGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBFA8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8A87C" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad8)"/>
  <rect width="400" height="500" fill="url(#glowGrad8)"/>

  <!-- Subtle quantum grid lines -->
  <g stroke="#E8A87C" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.18">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
  </g>

  <!-- Formula watermark -->
  <text x="370" y="45" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#E8A87C" opacity="0.4" text-anchor="end">L = D - A, lambda_2(L) &gt; 0</text>

  <!-- Track badge in top left corner of artwork -->
  <g transform="translate(26, 26)">
    <rect width="48" height="24" rx="4" fill="#142723" stroke="#8FBFA8" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#8FBFA8" text-anchor="middle">T08</text>
  </g>

  <!-- Track graphic visualization -->
  <g>
    
      <!-- Expander Graph Nodes & Adjacency Web -->
      <line x1="200" y1="100" x2="270" y2="140" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="200" y1="100" x2="130" y2="140" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="200" y1="100" x2="200" y2="180" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="270" y1="140" x2="280" y2="220" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="270" y1="140" x2="200" y2="180" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="280" y1="220" x2="200" y2="255" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="280" y1="220" x2="200" y2="180" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="200" y1="255" x2="120" y2="220" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="200" y1="255" x2="200" y2="180" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="120" y1="220" x2="130" y2="140" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="120" y1="220" x2="200" y2="180" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/><line x1="130" y1="140" x2="200" y2="180" stroke="#E8A87C" stroke-width="1.2" opacity="0.45"/>
      <!-- Nodes -->
      <circle cx="200" cy="100" r="6" fill="#8FBFA8"/>
      <circle cx="270" cy="140" r="5" fill="#E8A87C"/>
      <circle cx="280" cy="220" r="5.5" fill="#8FBFA8"/>
      <circle cx="200" cy="255" r="6" fill="#E8A87C"/>
      <circle cx="120" cy="220" r="5.5" fill="#8FBFA8"/>
      <circle cx="130" cy="140" r="5" fill="#E8A87C"/>
      <circle cx="200" cy="180" r="8" fill="#ffffff"/>
      <circle cx="200" cy="180" r="16" stroke="#8FBFA8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
    
  </g>
</svg>