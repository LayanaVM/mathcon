<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bgGrad7" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2C4E47" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#172F29" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glowGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8FBFA8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad7)"/>
  <rect width="400" height="500" fill="url(#glowGrad7)"/>

  <!-- Subtle quantum grid lines -->
  <g stroke="#8FBFA8" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.18">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
  </g>

  <!-- Formula watermark -->
  <text x="370" y="45" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#8FBFA8" opacity="0.4" text-anchor="end">dS/dt = -beta S I, dI/dt = beta S I - gamma I</text>

  <!-- Track badge in top left corner of artwork -->
  <g transform="translate(26, 26)">
    <rect width="48" height="24" rx="4" fill="#142723" stroke="#3ddc84" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#3ddc84" text-anchor="middle">T07</text>
  </g>

  <!-- Track graphic visualization -->
  <g>
    
      <!-- Trajectory flows & Compartmental Curves -->
      <path d="M 60 110 C 120 115, 180 180, 340 230" fill="none" stroke="#8FBFA8" stroke-width="2.5" opacity="0.8"/>
      <!-- Infection wave spike -->
      <path d="M 60 230 C 140 225, 170 90, 205 90 C 240 90, 270 215, 340 220" fill="none" stroke="#3ddc84" stroke-width="3" opacity="0.9"/>
      <!-- Recovery trajectory -->
      <path d="M 60 235 C 160 235, 230 180, 340 120" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="5 3" opacity="0.6"/>
      <!-- Peak critical threshold -->
      <line x1="60" y1="90" x2="340" y2="90" stroke="#3ddc84" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
      <circle cx="205" cy="90" r="6" fill="#3ddc84"/>
    
  </g>
</svg>