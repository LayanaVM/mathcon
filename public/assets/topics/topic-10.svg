<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bgGrad10" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2C4E47" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10231E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glowGrad10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBFA8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3ddc84" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad10)"/>
  <rect width="400" height="500" fill="url(#glowGrad10)"/>

  <!-- Subtle quantum grid lines -->
  <g stroke="#3ddc84" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.18">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
  </g>

  <!-- Formula watermark -->
  <text x="370" y="45" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#3ddc84" opacity="0.4" text-anchor="end">beta_k = rank(H_k), d(Delta) &lt;= epsilon</text>

  <!-- Track badge in top left corner of artwork -->
  <g transform="translate(26, 26)">
    <rect width="48" height="24" rx="4" fill="#142723" stroke="#8FBFA8" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#8FBFA8" text-anchor="middle">T10</text>
  </g>

  <!-- Track graphic visualization -->
  <g>
    
      <!-- Vietoris-Rips Simplicial Complex -->
      <polygon points="150,130 250,110 200,190" fill="#8FBFA8" fill-opacity="0.25" stroke="#8FBFA8" stroke-width="1.8"/>
      <polygon points="200,190 250,110 290,190" fill="#3ddc84" fill-opacity="0.2" stroke="#3ddc84" stroke-width="1.8"/>
      <polygon points="150,130 200,190 120,210" fill="#3ddc84" fill-opacity="0.15" stroke="#3ddc84" stroke-width="1.8"/>
      <!-- Filtration epsilon circles -->
      <circle cx="150" cy="130" r="45" stroke="#3ddc84" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
      <circle cx="250" cy="110" r="45" stroke="#8FBFA8" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
      <circle cx="200" cy="190" r="45" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
      <!-- Vertices -->
      <circle cx="150" cy="130" r="5" fill="#8FBFA8"/>
      <circle cx="250" cy="110" r="5" fill="#3ddc84"/>
      <circle cx="200" cy="190" r="6" fill="#ffffff"/>
      <circle cx="290" cy="190" r="4.5" fill="#8FBFA8"/>
      <circle cx="120" cy="210" r="4.5" fill="#3ddc84"/>
    
  </g>
</svg>