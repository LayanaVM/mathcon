<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bgGrad9" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2C4E47" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#152B25" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glowGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A87C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8FBFA8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad9)"/>
  <rect width="400" height="500" fill="url(#glowGrad9)"/>

  <!-- Subtle quantum grid lines -->
  <g stroke="#8FBFA8" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.18">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
  </g>

  <!-- Formula watermark -->
  <text x="370" y="45" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#8FBFA8" opacity="0.4" text-anchor="end">min c^T x s.t. Ax &lt;= b, mu_A(x) in [0,1]</text>

  <!-- Track badge in top left corner of artwork -->
  <g transform="translate(26, 26)">
    <rect width="48" height="24" rx="4" fill="#142723" stroke="#E8A87C" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#E8A87C" text-anchor="middle">T09</text>
  </g>

  <!-- Track graphic visualization -->
  <g>
    
      <!-- Convex Polytope 3D Facets & Gradient Contours -->
      <polygon points="200,90 280,140 260,230 140,230 120,140" fill="#E8A87C" fill-opacity="0.12" stroke="#E8A87C" stroke-width="2"/>
      <polygon points="200,90 260,230 200,180" fill="#8FBFA8" fill-opacity="0.15" stroke="#8FBFA8" stroke-width="1.2"/>
      <polygon points="200,90 140,230 200,180" fill="#ffffff" fill-opacity="0.08" stroke="#8FBFA8" stroke-width="1.2"/>
      <!-- Optimum vertex beacon -->
      <circle cx="200" cy="90" r="6" fill="#E8A87C"/>
      <circle cx="200" cy="90" r="14" stroke="#E8A87C" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <!-- Contour level curves -->
      <ellipse cx="200" cy="245" rx="110" ry="22" fill="none" stroke="#8FBFA8" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
      <ellipse cx="200" cy="245" rx="70" ry="14" fill="none" stroke="#8FBFA8" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
    
  </g>
</svg>