<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bgGrad4" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2C4E47" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#132621" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glowGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FBFA8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8A87C" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad4)"/>
  <rect width="400" height="500" fill="url(#glowGrad4)"/>

  <!-- Subtle quantum grid lines -->
  <g stroke="#E8A87C" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.18">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
  </g>

  <!-- Formula watermark -->
  <text x="370" y="45" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#E8A87C" opacity="0.4" text-anchor="end">s = H * r^T | d_min &gt;= 2t+1</text>

  <!-- Track badge in top left corner of artwork -->
  <g transform="translate(26, 26)">
    <rect width="48" height="24" rx="4" fill="#142723" stroke="#8FBFA8" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#8FBFA8" text-anchor="middle">T04</text>
  </g>

  <!-- Track graphic visualization -->
  <g>
    
      <!-- Hamming Sphere & Constellations -->
      <circle cx="160" cy="165" r="70" fill="#8FBFA8" fill-opacity="0.1" stroke="#8FBFA8" stroke-width="2" opacity="0.6"/>
      <circle cx="240" cy="195" r="70" fill="#E8A87C" fill-opacity="0.1" stroke="#E8A87C" stroke-width="2" opacity="0.6"/>
      <!-- Center Codewords -->
      <circle cx="160" cy="165" r="6" fill="#8FBFA8"/>
      <circle cx="240" cy="195" r="6" fill="#E8A87C"/>
      <!-- Syndrome projection lines -->
      <line x1="160" y1="165" x2="240" y2="195" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
      <!-- Hypercube vertices -->
      <rect x="130" y="110" width="140" height="140" fill="none" stroke="#E8A87C" stroke-width="1" opacity="0.3"/>
      <rect x="150" y="90" width="140" height="140" fill="none" stroke="#8FBFA8" stroke-width="1" opacity="0.3"/>
      <line x1="130" y1="110" x2="150" y2="90" stroke="#E8A87C" stroke-width="1" opacity="0.3"/>
      <line x1="270" y1="110" x2="290" y2="90" stroke="#E8A87C" stroke-width="1" opacity="0.3"/>
      <line x1="130" y1="250" x2="150" y2="230" stroke="#E8A87C" stroke-width="1" opacity="0.3"/>
      <line x1="270" y1="250" x2="290" y2="230" stroke="#E8A87C" stroke-width="1" opacity="0.3"/>
    
  </g>
</svg>