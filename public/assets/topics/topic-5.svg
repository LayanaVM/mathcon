<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" fill="none">
  <defs>
    <radialGradient id="bgGrad5" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2C4E47" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#162C26" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1B17" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="glowGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8A87C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8FBFA8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad5)"/>
  <rect width="400" height="500" fill="url(#glowGrad5)"/>

  <!-- Subtle quantum grid lines -->
  <g stroke="#8FBFA8" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.18">
    <line x1="0" y1="70" x2="400" y2="70"/>
    <line x1="0" y1="140" x2="400" y2="140"/>
    <line x1="0" y1="210" x2="400" y2="210"/>
    <line x1="0" y1="280" x2="400" y2="280"/>
    <line x1="100" y1="0" x2="100" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="300" y1="0" x2="300" y2="350"/>
  </g>

  <!-- Formula watermark -->
  <text x="370" y="45" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" fill="#8FBFA8" opacity="0.4" text-anchor="end">&lt;f, g&gt; = int f(t) g*(t) dt</text>

  <!-- Track badge in top left corner of artwork -->
  <g transform="translate(26, 26)">
    <rect width="48" height="24" rx="4" fill="#142723" stroke="#E8A87C" stroke-width="1.2" opacity="0.9"/>
    <text x="24" y="16.5" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#E8A87C" text-anchor="middle">T05</text>
  </g>

  <!-- Track graphic visualization -->
  <g>
    
      <!-- Wavelet packets & Hilbert Space Orbit -->
      <path d="M 60 180 Q 95 100 130 180 T 200 180 T 270 180 T 340 180" fill="none" stroke="#8FBFA8" stroke-width="2" opacity="0.7"/>
      <path d="M 60 180 Q 110 50 160 180 T 260 180 T 340 180" fill="none" stroke="#E8A87C" stroke-width="2.5" opacity="0.85"/>
      <!-- Gaussian wave envelope -->
      <path d="M 60 180 C 130 90, 270 90, 340 180" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
      <!-- Inner product basis grid -->
      <line x1="60" y1="180" x2="340" y2="180" stroke="#8FBFA8" stroke-width="1" opacity="0.4"/>
      <line x1="200" y1="70" x2="200" y2="260" stroke="#8FBFA8" stroke-width="1" opacity="0.4"/>
      <circle cx="200" cy="180" r="5" fill="#E8A87C"/>
    
  </g>
</svg>